services:
  db:
    image: mysql:8.0
    container_name: saude_mysql_container
    restart: always
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: 'root'
      MYSQL_DATABASE: 'passaporte_saude'
    ports:
      - "3307:3306"
    volumes:
      - ./db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./BackEnd
    container_name: saude_backend_container
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./FrontEnd
    container_name: saude_frontend_container
    ports:
      - "3000:3000"
    depends_on:
      - backend

  playwright:
    build: ./FrontEnd
    container_name: saude_playwright_container
    volumes:
      - ./FrontEnd/tests:/app/tests
    command: >
      sh -c "
        echo 'Aguardando frontend iniciar...' &&
        until curl -sf http://frontend:3000 > /dev/null; do sleep 3; done &&
        echo 'Frontend pronto! Rodando testes...' &&
        npx playwright test --reporter=list
      "
    environment:
      - PLAYWRIGHT_BASE_URL=http://frontend:3000
    depends_on:
      - frontend
    profiles:
      - test
